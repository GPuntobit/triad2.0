tools:
    - name: eslint
      languages: [Javascript, TypeScript]
      extensions: [.js, .jsm, .jsx, .mjs, .ts, .tsx, .vue]
      files: []
    - name: lizard
      languages: [CSharp, Javascript, Python, Swift, TypeScript]
      extensions: [.cs, .js, .jsm, .jsx, .mjs, .py, .swift, .ts, .tsx, .vue]
      files: []
    - name: opengrep
      languages: [CSharp, Javascript, Python, Shell, Swift, TypeScript, YAML]
      extensions: [.bash, .cs, .env, .js, .jsm, .jsx, .mjs, .py, .sh, .swift, .ts, .tsx, .vue, .yaml, .yml]
      files: []
    - name: pmd
      languages: [Javascript, Swift, TypeScript, XML]
      extensions: [.js, .jsm, .jsx, .mjs, .pom, .swift, .ts, .tsx, .vue, .wsdl, .xml, .xsl]
      files: []
    - name: pylint
      languages: [Python]
      extensions: [.py]
      files: []
    - name: trivy
      languages: [CSharp, JSON, Javascript, Python, Swift, TypeScript, XML, YAML]
      extensions: [.cs, .env, .js, .jsm, .json, .jsx, .mjs, .pom, .py, .swift, .ts, .tsx, .vue, .wsdl, .xml, .xsl, .yaml, .yml]
      files: [.deps.json, .env, .env.dev, .env.development, .env.prod, .env.production, .env.staging, Directory.Packages.props, Package.resolved, Packages.props, Pipfile.lock, Podfile.lock, package-lock.json, package.json, packages.config, packages.lock.json, pnpm-lock.yaml, poetry.lock, requirements.txt, uv.lock, yarn.lock]
