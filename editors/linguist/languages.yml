# Ready entry for github-linguist/linguist (lib/linguist/languages.yml).
# It is not yet part of Linguist: it must be proposed with a PR.
#
# Note: .td is already assigned to TableGen (LLVM); that's why the entry uses .triad as
# canonical extension. Linguist heuristics may in the future append .td only
# with a reliable discriminator: we don't do this for now (avoids false positives).
Triad:
  type: programming
  color: "#2f6f9f"
  extensions:
    - ".triad"
  aliases:
    - triad
  tm_scope: source.triad
  ace_mode: text
  language_id: 0 # linguist assigns a unique id in the PR