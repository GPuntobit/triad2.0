name: Release (native assets only)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - name: Check release tag and version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*-beta.[0-9]*) ;;
            *) echo 'Unsupported release tag' >&2; exit 1 ;;
          esac
          test "$(cat VERSION)" = "${TAG#v}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
      - name: Native verification and source integrity
        run: |
          sh scripts/no-js.sh
          sh verify.sh
          sh tests/security/run.sh
      - name: Collect native seed and complete source distribution
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release-assets
          xxd -r -p seed/linux-x86_64/seed.hex release-assets/seed-linux-x86_64
          chmod +x release-assets/seed-linux-x86_64
          cp seed/windows-x86_64/seed.exe release-assets/seed.exe
          git archive --format=tar.gz --prefix="triad-$TAG/" \
            -o "release-assets/triad-$TAG-source.tar.gz" HEAD
          (cd release-assets && sha256sum seed-linux-x86_64 seed.exe *-source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: triad-native-release
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: triad-native-release
          path: release-assets
      - name: Publish native prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" release-assets/* --verify-tag --prerelease \
            --title "Triad 2.0 - $TAG" --generate-notes
