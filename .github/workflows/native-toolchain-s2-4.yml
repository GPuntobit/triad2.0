name: Triad Native Multi-Variable CFG S2.4
on:
  push:
    paths:
      - 'selfhost/toolchain/**'
      - '.github/workflows/native-toolchain-s2-4.yml'
  pull_request:
    paths:
      - 'selfhost/toolchain/**'
      - '.github/workflows/native-toolchain-s2-4.yml'
permissions:
  contents: read
jobs:
  multi-variable-cfg:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Isolate native S2.4 IR failing operation (temporary)
        run: |
          set +e
          sh selfhost/toolchain/lower-triad-s2-4.sh selfhost/toolchain/tests/frontend24/multi.triad /tmp/multi.tir
          echo 'FRONTEND IR:'
          cat /tmp/multi.tir
          sh selfhost/toolchain/lower-ir.sh /tmp/multi.tir /tmp/multi.s2asm
          echo "full ir rc=$?"
          for spec in basic frame store load add compare; do
            case "$spec" in
              basic) printf 'start\ni32_const 4\nexit\n' > /tmp/probe.tir ;;
              frame) printf 'start\ni32_frame 32\ni32_const 4\nexit\n' > /tmp/probe.tir ;;
              store) printf 'start\ni32_frame 32\ni32_const 4\ni32_store 0\nexit\n' > /tmp/probe.tir ;;
              load) printf 'start\ni32_frame 32\ni32_const 4\ni32_store 0\ni32_load 0\nexit\n' > /tmp/probe.tir ;;
              add) printf 'start\ni32_frame 32\ni32_const 4\ni32_store 0\ni32_load 0\ni32_add_slot 0\nexit\n' > /tmp/probe.tir ;;
              compare) printf 'start\ni32_frame 32\ni32_const 4\ni32_store 0\ni32_load 0\ni32_compare_slot 0\nbr_zero ok\nlabel ok\nexit\n' > /tmp/probe.tir ;;
            esac
            echo "CASE: $spec"
            sh selfhost/toolchain/lower-ir.sh /tmp/probe.tir /tmp/probe.s2asm
            echo "RC=$?"
            [ -f /tmp/probe.s2asm ] && cat /tmp/probe.s2asm
          done
      - name: Diagnose long nested IR lowering thresholds
        run: |
          set +e
          sh selfhost/toolchain/lower-triad-s2-4.sh selfhost/toolchain/tests/frontend24/nested.triad /tmp/nested.tir
          wc -lc /tmp/nested.tir
          for n in 8 12 16 20 21 22 23 24 26 28 30 35; do
            head -n "$n" /tmp/nested.tir > /tmp/prefix.tir
            printf 'exit\n' >> /tmp/prefix.tir
            sh selfhost/toolchain/lower-ir.sh /tmp/prefix.tir /tmp/prefix.s2asm > /tmp/probe.stdout 2> /tmp/probe.stderr
            echo "PREFIX $n RC=$?"
            cat /tmp/probe.stderr
          done
          for n in 12 20 24 30 40; do
            printf 'start\ni32_frame 32\n' > /tmp/repeat.tir
            i=0
            while [ "$i" -lt "$n" ]; do
              printf 'i32_const 1\ni32_store 0\n' >> /tmp/repeat.tir
              i=$((i+1))
            done
            printf 'exit\n' >> /tmp/repeat.tir
            sh selfhost/toolchain/lower-ir.sh /tmp/repeat.tir /tmp/repeat.s2asm > /tmp/repeat.stdout 2> /tmp/repeat.stderr
            echo "REPEAT $n RC=$?"
            cat /tmp/repeat.stderr
          done
      - name: S2.4 native multi-variable, stack, CFG and S0 differential
        run: sh selfhost/toolchain/tests/run_s2_4.sh
      - name: S2.3 frontend regression
        run: sh selfhost/toolchain/tests/run_s2_3.sh
      - name: S2.2 IR and seed fragment regression
        run: sh selfhost/toolchain/tests/run_s2_2.sh
      - name: S2.1 assembler regression
        run: sh selfhost/toolchain/tests/run_s2_1.sh
      - name: S2.0 ELF emitter regression
        run: sh selfhost/toolchain/tests/run.sh
      - name: Native and zero-JavaScript conformance
        run: sh verify.sh
