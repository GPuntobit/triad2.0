name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  conformance-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
      - name: Decode seed (Linux)
        run: |
          xxd -r -p seed/linux-x86_64/seed.hex seed/linux-x86_64/seed
          chmod +x seed/linux-x86_64/seed
      - name: Conformance Core (Node runner)
        run: node conformance/run.mjs --cases conformance/core/cases --skip liste
      - name: Sorgenti selfhost validi Triad-Core
        run: |
          for f in selfhost/*.td; do
            echo "check $f"
            node seed/dev/triad_core.cjs "$f" > /dev/null
          done

  security:
    # Verifiche di sicurezza (tests/security/run.sh): isolamento Python,
    # path hijack, workflow pinnati, sanitizzazione, token, path spostati.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
      - name: Security checks
        run: sh tests/security/run.sh

  site-gen:
    # Il sito statico in docs/ è generato da programmi Triad (tools/site-gen).
    # La CI verifica due cose: che i sorgenti dei generatori restino nel
    # sottoinsieme Triad-Core portabile, e che i file pubblicati coincidano
    # con il generato. Su Windows il confronto avviene anche fra i due
    # runtime (seed in codice macchina e interprete di riferimento JS).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
      - name: Lint dei generatori Triad
        run: node tools/site-gen/lint.mjs
      - name: Sito generato in sync con i sorgenti
        run: node tools/site-gen/build.mjs --check

  seed-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
      - name: "AV exclusion (PE generato dal dump: falso positivo noto)"
        shell: pwsh
        continue-on-error: true
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\seed\windows-x86_64"
      - name: Decode seed
        shell: pwsh
        run: |
          Remove-Item seed/windows-x86_64/seed.exe -ErrorAction SilentlyContinue
          certutil -decodehex seed/windows-x86_64/seed.hex seed/windows-x86_64/seed.exe
      - name: Seed conformance cases (runner unico: scoperta directory + golden)
        shell: pwsh
        run: node conformance/run.mjs --cases conformance/core/cases --skip liste
      - name: Probe seed vs interprete JS (ok_* e test_*)
        shell: pwsh
        run: node tests/probes/run_probes.mjs --strict
      - name: Front-end S1 (selfhost/source.td): golden e confronto seed/JS
        shell: pwsh
        run: node tests/probes/run_probes.mjs selfhost/source.td
      - name: Seed get probe
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP "test_get.out"
          $p = Start-Process .\seed\windows-x86_64\seed.exe -ArgumentList "tests\\probes\\test_get.td" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode) for test_get.td" }
          $got = (Get-Content $out -Raw) -replace "`r`n", "`n"
          if ($got -cne "20`n") { throw "unexpected output for test_get.td: $got" }
      - name: Self-hosted environment smoke test (not S1 conformance)
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP "selfhost-main.out"
          $p = Start-Process .\seed\windows-x86_64\seed.exe -ArgumentList "selfhost\main.td" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode) for selfhost\main.td" }
          $got = [System.IO.File]::ReadAllBytes($out)
          $expected = [System.Text.Encoding]::ASCII.GetBytes("Value: 10`n")
          if ([BitConverter]::ToString($got) -cne [BitConverter]::ToString($expected)) {
            throw "unexpected byte output for selfhost\main.td: $([System.Text.Encoding]::ASCII.GetString($got))"
          }
      - name: Hash check
        shell: pwsh
        run: |
          $h = (Get-FileHash seed/windows-x86_64/seed.hex -Algorithm SHA256).Hash
          if ($h -ne '4235A70790BAA6784DC3D944616705B37E76ED2263CE73210BCC20E53639B8F7') { throw "hash mismatch: $h" }
  seed-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Decode ELF
        run: |
          sudo apt-get update
          sudo apt-get install -y xxd || sudo apt-get install -y vim-common
          xxd -r -p seed/linux-x86_64/seed.hex seed/linux-x86_64/seed
          chmod +x seed/linux-x86_64/seed
      - name: Run E0
        run: |
          out=$(./seed/linux-x86_64/seed)
          test "$out" = "Triad seed Linux OK"
      - name: Hash check
        run: |
          h=$(sha256sum seed/linux-x86_64/seed.hex | cut -d' ' -f1)
          test "$h" = "ad4c9f08176d9964d5be17d44c72230184434025980447395e7a3250f63ca5ea"

  linux-toolchain:
    # Verifica che l'intera toolchain POSIX funzioni su Linux: launcher,
    # install.sh (senza root), esecuzione di programmi .td e suite di
    # conformità tramite i launcher installati.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
      - name: Launcher bin/triad esegue un programma
        run: ./bin/triad tests/probes/test_simple.td | grep -q '^test$'
      - name: install.sh (utente non root, prefix temporaneo)
        run: |
          ./install.sh --prefix "$RUNNER_TEMP/triad-bin" --no-desktop
          export PATH="$RUNNER_TEMP/triad-bin:$PATH"
          triad tests/probes/test_let.td | grep -q '^15$'
          triad-cli status >/dev/null
      - name: Conformance via launcher installato
        run: |
          export PATH="$RUNNER_TEMP/triad-bin:$PATH"
          triad-cli test conformance
