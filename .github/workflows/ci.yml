name: CI
on:
  push:
  pull_request:
jobs:
  conformance-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Decode seed (Linux)
        run: |
          xxd -r -p seed/linux-x86_64/seed.hex seed/linux-x86_64/seed
          chmod +x seed/linux-x86_64/seed
      - name: Conformance Core (Node runner)
        run: node conformance/run.mjs --cases conformance/core/cases --skip liste

  seed-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: "AV exclusion (PE generato dal dump: falso positivo noto)"
        shell: pwsh
        continue-on-error: true
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\seed\windows-x86_64"
      - name: Decode seed
        shell: pwsh
        run: |
          Remove-Item seed/windows-x86_64/seed.exe -ErrorAction SilentlyContinue
          certutil -decodehex seed/windows-x86_64/seed.hex seed/windows-x86_64/seed.exe
      - name: Seed conformance cases
        shell: pwsh
        run: |
          $cases = @('interi','variabili','funzioni_semplici','ricorsione','confronti','operatori','if_else','if_elseif','if_nested','if_no_else','while_loop','lambda','closure','chiusure','scope','funzioni_blocco','funzioni_io','funzioni','aritmetica','begin_block','formula','stringhe','stringhe_base','nothing_base','stringhe_concat','simboli_base','stringhe_multi','chiusure_local','let_annidato','let_chiusura','chiusura_in_if','liste_base','liste_push')
          foreach ($c in $cases) {
            $out = Join-Path $env:TEMP "$c.out"
            Remove-Item $out -ErrorAction SilentlyContinue
            $p = Start-Process .\seed\windows-x86_64\seed.exe -ArgumentList "conformance\core\cases\$c\program.td" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out
            if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode) for $c" }
            $got = (Get-Content $out -Raw) -replace "`r`n", "`n"
            $expFile = "conformance\core\cases\$c\expected.out"
            if (-not (Test-Path $expFile)) { $expFile = "conformance\core\cases\$c\expected.golden" }
            $exp = (Get-Content $expFile -Raw) -replace "`r`n", "`n"
            if ($got -ne $exp) { throw "output mismatch for $c" }
          }
      - name: Seed get probe
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP "test_get.out"
          $p = Start-Process .\seed\windows-x86_64\seed.exe -ArgumentList "test_get.td" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode) for test_get.td" }
          $got = (Get-Content $out -Raw) -replace "`r`n", "`n"
          if ($got -cne "20`n") { throw "unexpected output for test_get.td: $got" }
      - name: Self-hosted environment smoke test (not S1 conformance)
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP "selfhost-main.out"
          $p = Start-Process .\seed\windows-x86_64\seed.exe -ArgumentList "selfhost\main.td" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode) for selfhost\main.td" }
          $got = [System.IO.File]::ReadAllBytes($out)
          $expected = [System.Text.Encoding]::ASCII.GetBytes("Value: 10`n")
          if ([BitConverter]::ToString($got) -cne [BitConverter]::ToString($expected)) {
            throw "unexpected byte output for selfhost\main.td: $([System.Text.Encoding]::ASCII.GetString($got))"
          }
      - name: Hash check
        shell: pwsh
        run: |
          $h = (Get-FileHash seed/windows-x86_64/seed.hex -Algorithm SHA256).Hash
          if ($h -ne '3A75A21E2F47D8DC4C88D4BC2580A85D5349BCDF7550E5FFA16E2C0AC7CA8C11') { throw "hash mismatch: $h" }
  seed-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Decode ELF
        run: |
          sudo apt-get update
          sudo apt-get install -y xxd || sudo apt-get install -y vim-common
          xxd -r -p seed/linux-x86_64/seed.hex seed/linux-x86_64/seed
          chmod +x seed/linux-x86_64/seed
      - name: Run E0
        run: |
          out=$(./seed/linux-x86_64/seed)
          test "$out" = "Triad seed Linux OK"
      - name: Hash check
        run: |
          h=$(sha256sum seed/linux-x86_64/seed.hex | cut -d' ' -f1)
          test "$h" = "ad4c9f08176d9964d5be17d44c72230184434025980447395e7a3250f63ca5ea"
