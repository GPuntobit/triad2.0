name: CI — Native Triad (no JavaScript)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Decode Linux machine-code seed
        run: |
          xxd -r -p seed/linux-x86_64/seed.hex seed/linux-x86_64/seed
          chmod +x seed/linux-x86_64/seed
      - name: Normative Triad Core and S1 regression
        run: sh verify.sh
      - name: Native TRID experimental journal
        run: sh cognitive/native/tests/run.sh
      - name: Native TRID multilevel proof/pulse suite
        run: |
          sh cognitive/native/tests/run_05.sh
          sh cognitive/native/tests/run_06.sh

  seed-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate committed native seed dumps
        run: |
          printf '%s\n' \
            '8457051f7d083ab834ec860502605a58f1ecce4a5abca88391a804898315d613  seed/linux-x86_64/seed.hex' \
            '20aa566dae21d2b102e684f7a8c1b67b1b2b44c61c1116e16d196de31683d7b7  seed/windows-x86_64/seed.hex' \
            | sha256sum --check
          xxd -r -p seed/linux-x86_64/seed.hex seed/linux-x86_64/seed
          chmod +x seed/linux-x86_64/seed
          sh seed/linux-x86_64/check_seed.sh ./seed/linux-x86_64/seed

  native-toolchain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Native install and CLI
        run: |
          ./install.sh --prefix "$RUNNER_TEMP/triad-bin" --no-desktop
          export PATH="$RUNNER_TEMP/triad-bin:$PATH"
          triad tests/probes/test_let.td | grep -q '^15$'
          triad-cli status
          triad-cli test all
          sh tests/desktop.sh
      - name: Reject drift from golden output
        run: |
          cp tests/probes/test_simple.expected.out "$RUNNER_TEMP/golden.bak"
          echo tamper >> tests/probes/test_simple.expected.out
          if ./install.sh --prefix "$RUNNER_TEMP/triad-bad" --no-desktop; then
            echo 'ERROR: installation accepted incorrect golden' >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/golden.bak" tests/probes/test_simple.expected.out

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Security and no-JavaScript source policy
        run: |
          sh scripts/no-js.sh
          sh tests/security/run.sh

  static-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate static HTML documentation without client scripts
        run: |
          sh scripts/no-js.sh
          test -s docs/index.html
          test -s docs/pages/getting-started.html
          test -s docs/pages/spec.html
      - name: Generate static docs with native Triad
        run: sh tools/site-gen/build.sh --dry-run
