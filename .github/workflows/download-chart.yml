name: Download chart

# Rigenera quotidianamente il grafico dei download delle release
# (docs/assets/img/downloads.svg) usato in fondo al README.md.

on:
  schedule:
    - cron: "17 3 * * *"   # ogni giorno ~03:17 UTC
  workflow_dispatch: {}     # esecuzione manuale da Actions
  push:
    paths:
      - scripts/docs/download_chart.py
      - .github/workflows/download-chart.yml

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # setup-python non serve: download_chart.py usa solo la libreria standard
      # e su ubuntu-24.04 python3 e' gia' presente. (Inoltre le azioni v4/v5
      # facevano girare il workflow su Node.js 20, deprecato: i runner ora
      # forzano Node.js 24 emettendo un warning.)

      - name: Genera il grafico download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIAD_REPO: ${{ github.repository }}
        run: python3 scripts/docs/download_chart.py

      - name: Commit del grafico aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/assets/img/downloads.svg)" ]; then
            git add docs/assets/img/downloads.svg
            git commit -m "chore(chart): aggiorna grafico download [skip ci]"
            git push
          else
            echo "Nessuna variazione nel grafico."
          fi
