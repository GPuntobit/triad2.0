name: TRID Native Core
on:
  push:
    paths:
      - 'cognitive/native/**'
      - '.github/workflows/trid-native.yml'
  pull_request:
    paths:
      - 'cognitive/native/**'
      - '.github/workflows/trid-native.yml'
permissions:
  contents: read
jobs:
  trid-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Decode existing native S0 seed
        run: |
          xxd -r -p seed/linux-x86_64/seed.hex seed/linux-x86_64/seed
          chmod +x seed/linux-x86_64/seed
      - name: Diagnostic native file reading and development oracle (development only)
        run: |
          mkdir -p /tmp/trid-native-debug
          cp cognitive/native/fixture.txt /tmp/trid-native-debug/fixture.txt
          : > /tmp/trid-native-debug/journal.log
          cat cognitive/native/common.triad cognitive/native/discover.triad > /tmp/trid-native-debug/discover.triad
          printf 'println(strlen(readfile("fixture.txt")))\n' > /tmp/trid-native-debug/read.triad
          echo 'Native S0 readfile check:'
          ( cd /tmp/trid-native-debug; "$GITHUB_WORKSPACE/bin/triad" /tmp/trid-native-debug/read.triad ) || true
          echo 'Seed certified-subset static diagnostics:'
          node tools/selfhost-guard/guard.mjs /tmp/trid-native-debug/discover.triad || true
          echo 'Development oracle diagnostic:'
          ( cd /tmp/trid-native-debug; node "$GITHUB_WORKSPACE/seed/dev/triad_core.cjs" /tmp/trid-native-debug/discover.triad ) || true
          echo 'Native S0 discovery direct diagnostic:'
          ( cd /tmp/trid-native-debug; "$GITHUB_WORKSPACE/bin/triad" /tmp/trid-native-debug/discover.triad ) || true
      - name: Native Triad cognitive regression (no Python/Node interpreter)
        run: sh cognitive/native/tests/run.sh
      - name: Existing native Triad conformance gate
        run: sh verify.sh
