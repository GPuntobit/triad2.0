name: TRID Native Core
on:
  push:
    paths:
      - 'cognitive/native/**'
      - '.github/workflows/trid-native.yml'
  pull_request:
    paths:
      - 'cognitive/native/**'
      - '.github/workflows/trid-native.yml'
permissions:
  contents: read
jobs:
  trid-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Decode existing native S0 seed
        run: |
          xxd -r -p seed/linux-x86_64/seed.hex seed/linux-x86_64/seed
          chmod +x seed/linux-x86_64/seed
      - name: Diagnostic parse with development oracle (not the application runtime)
        run: |
          cat cognitive/native/common.triad cognitive/native/discover.triad > /tmp/trid-discover-debug.triad
          : > /tmp/trid-empty-journal.log
          node seed/dev/triad_core.cjs /tmp/trid-discover-debug.triad cognitive/native/fixture.txt /tmp/trid-empty-journal.log || true
          printf 'println(length(ARGS))\nprintln(ARGS[1])\n' > /tmp/trid-args-debug.triad
          echo 'Native S0 arguments diagnostic:'
          ./bin/triad /tmp/trid-args-debug.triad alpha beta || true
          echo 'Native S0 direct discovery diagnostic:'
          ./bin/triad /tmp/trid-discover-debug.triad cognitive/native/fixture.txt /tmp/trid-empty-journal.log || true
      - name: Native Triad cognitive regression (no Python/Node interpreter)
        run: sh cognitive/native/tests/run.sh
      - name: Existing native Triad conformance gate
        run: sh verify.sh
