name: TRID Native Core
on:
  push:
    paths:
      - 'cognitive/native/**'
      - 'cognitive/tests/**'
      - 'cognitive/examples/**'
      - '.github/workflows/trid-native.yml'
  pull_request:
    paths:
      - 'cognitive/native/**'
      - 'cognitive/tests/**'
      - 'cognitive/examples/**'
      - '.github/workflows/trid-native.yml'
permissions:
  contents: read
jobs:
  trid-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Decode native S0 seed
        run: |
          xxd -r -p seed/linux-x86_64/seed.hex seed/linux-x86_64/seed
          chmod +x seed/linux-x86_64/seed
      - name: S1 discovery golden test
        run: sh cognitive/tests/run.sh
      - name: Native discovery, journal, verification and revocation
        run: sh cognitive/native/tests/run.sh
      - name: Existing native conformance
        run: sh verify.sh
