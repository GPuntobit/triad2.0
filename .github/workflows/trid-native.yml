name: TRID Native Core
on:
  push:
    paths:
      - 'cognitive/native/**'
      - '.github/workflows/trid-native.yml'
  pull_request:
    paths:
      - 'cognitive/native/**'
      - '.github/workflows/trid-native.yml'
permissions:
  contents: read
jobs:
  trid-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Decode existing native S0 seed
        run: |
          xxd -r -p seed/linux-x86_64/seed.hex seed/linux-x86_64/seed
          chmod +x seed/linux-x86_64/seed
      - name: Diagnostic native file reading and development oracle (development only)
        run: |
          mkdir -p /tmp/trid-native-debug
          cp cognitive/native/fixture.txt /tmp/trid-native-debug/fixture.txt
          : > /tmp/trid-native-debug/journal.log
          cat cognitive/native/common.triad cognitive/native/discover.triad > /tmp/trid-native-debug/discover.triad
          printf 'println(strlen(readfile("fixture.txt")))\n' > /tmp/trid-native-debug/read.triad
          echo 'Native S0 readfile check:'
          ( cd /tmp/trid-native-debug; "$GITHUB_WORKSPACE/bin/triad" /tmp/trid-native-debug/read.triad ) || true
          echo 'Seed certified-subset static diagnostics:'
          node tools/selfhost-guard/guard.mjs /tmp/trid-native-debug/discover.triad || true
          echo 'Development oracle diagnostic:'
          ( cd /tmp/trid-native-debug; node "$GITHUB_WORKSPACE/seed/dev/triad_core.cjs" /tmp/trid-native-debug/discover.triad ) || true
          echo 'Native S0 function-definitions file-read diagnostic:'
          sed '/^println("BEGIN 1")/,$d' /tmp/trid-native-debug/discover.triad > /tmp/trid-native-debug/functions-only.triad
          printf 'println(strlen(readfile("fixture.txt")))\n' >> /tmp/trid-native-debug/functions-only.triad
          ( cd /tmp/trid-native-debug; "$GITHUB_WORKSPACE/bin/triad" /tmp/trid-native-debug/functions-only.triad ) || true
          echo 'Native S0 discovery direct diagnostic:'
          ( cd /tmp/trid-native-debug; "$GITHUB_WORKSPACE/bin/triad" /tmp/trid-native-debug/discover.triad ) || true
      - name: Minimal seed function/return diagnostic
        run: |
          set +e
          mkdir -p /tmp/trid-diag
          cp cognitive/native/fixture.txt /tmp/trid-diag/fixture.txt
          cat > /tmp/trid-diag/probe.triad <<'TRIAD'
          function load(path)
              println("LOAD-ENTER")
              src = readfile(path)
              println("LOAD-READ", strlen(src))
              src
          end
          println("PROBE-START")
          result = load("fixture.txt")
          println("PROBE-RETURN", strlen(result))
          TRIAD
          ( cd /tmp/trid-diag && "$GITHUB_WORKSPACE/bin/triad" probe.triad )
          echo "probe rc=$?"
          cp cognitive/native/common.triad /tmp/trid-diag/common.triad
          cat >> /tmp/trid-diag/common.triad <<'TRIAD'
          println("COMMON-START")
          rows = parse_file("fixture.txt")
          println("COMMON-RETURN", length(rows))
          TRIAD
          ( cd /tmp/trid-diag && "$GITHUB_WORKSPACE/bin/triad" common.triad )
          echo "common rc=$?"
      - name: Check literal readfile assignments and parser input
        run: |
          set +e
          cd /tmp/trid-native-debug
          printf 'data = readfile("fixture.txt")\nprintln("A:", strlen(data))\n' > assign.triad
          "$GITHUB_WORKSPACE/bin/triad" assign.triad; echo "assignment=$?"
          printf 'f(x) = strlen(x)\nprintln("B:", f(readfile("fixture.txt")))\n' > call.triad
          "$GITHUB_WORKSPACE/bin/triad" call.triad; echo "call=$?"
          sed '/^println("BEGIN 1")/,$d' discover.triad > function.triad
          printf 'data = parse_text(readfile("fixture.txt"))\nprintln("C:", length(data))\n' >> function.triad
          "$GITHUB_WORKSPACE/bin/triad" function.triad; echo "parser=$?"
      - name: Native seed List primitives diagnostic
        run: |
          set +e
          mkdir -p /tmp/trid-lists
          cat > /tmp/trid-lists/a.triad <<'TRIAD'
          data = []
          println("EMPTY ", length(data))
          push!(data, ["edge", "family"])
          println("ONE ", length(data))
          println("NESTED ", length(data[1]))
          TRIAD
          "$GITHUB_WORKSPACE/bin/triad" /tmp/trid-lists/a.triad; echo "list-status=$?"
          cat > /tmp/trid-lists/b.triad <<'TRIAD'
          data = [["edge", "family"], ["edge", "parent"]]
          println("LITERAL ", length(data))
          TRIAD
          "$GITHUB_WORKSPACE/bin/triad" /tmp/trid-lists/b.triad; echo "literal-status=$?"
      - name: Seed small list operations matrix
        run: |
          set +e
          mkdir -p /tmp/trid-atom
          printf 'println([1,2])\n' > /tmp/trid-atom/v1.triad
          printf 'a = [1,2]\nprintln("OK")\n' > /tmp/trid-atom/v2.triad
          printf 'a = [1,2]\nprintln(a)\n' > /tmp/trid-atom/v3.triad
          printf 'a = [1,2]\nprintln(length(a))\n' > /tmp/trid-atom/v4.triad
          printf 'a = []\nprintln("OK")\n' > /tmp/trid-atom/v5.triad
          printf 'a = []\npush!(a, 7)\nprintln("OK")\n' > /tmp/trid-atom/v6.triad
          for i in 1 2 3 4 5 6; do
            echo "CASE-$i"
            "$GITHUB_WORKSPACE/bin/triad" "/tmp/trid-atom/v$i.triad"
            echo "CODE-$i=$?"
          done
      - name: Native S1 logic smoke test
        run: ./bin/triad --logic cognitive/native/s1_discovery.triad
      - name: Native Triad cognitive regression (no Python/Node interpreter)
        run: sh cognitive/native/tests/run.sh
      - name: Existing native Triad conformance gate
        run: sh verify.sh
