name: TRID-Core 0.6 Native Graph
on:
  push:
    paths:
      - 'cognitive/native/s1_graph_06.triad'
      - 'cognitive/native/graph_06.facts'
      - 'cognitive/native/run_06.sh'
      - 'cognitive/native/tests/run_06.sh'
      - '.github/workflows/trid-core-06.yml'
  pull_request:
    paths:
      - 'cognitive/native/s1_graph_06.triad'
      - 'cognitive/native/graph_06.facts'
      - 'cognitive/native/run_06.sh'
      - 'cognitive/native/tests/run_06.sh'
      - '.github/workflows/trid-core-06.yml'
permissions:
  contents: read
jobs:
  trid-core-06-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Diagnose S1 graph components independently
        run: |
          set +e
          ROOT="$PWD"
          mkdir -p /tmp/trid06
          cp cognitive/native/graph_06.facts /tmp/trid06/facts
          # Each case is built from successively larger sets of Horn clauses.
          awk '/^# Output contract:/{exit}{print}' cognitive/native/s1_graph_06.triad > /tmp/trid06/rules
          head -n 0 /tmp/trid06/rules > /tmp/trid06/none
          for n in 0 1 2 3 4 5; do
            case "$n" in
              0) { cat /tmp/trid06/facts; echo 'println([s.z for s in solve evidence(:trid, ?z, ?src)])'; } > /tmp/trid06/case.triad ;;
              1) { cat /tmp/trid06/facts; grep '^rule in_path' /tmp/trid06/rules; echo 'println(solve in_path(:trid, [:trid]))'; } > /tmp/trid06/case.triad ;;
              2) { cat /tmp/trid06/facts; grep '^rule in_path\|^rule proof_path' /tmp/trid06/rules; echo 'println([s.sources for s in solve proof_path(:trid, :deep5, [:trid], ?sources)])'; } > /tmp/trid06/case.triad ;;
              3) { cat /tmp/trid06/facts; grep '^rule in_path\|^rule proof_path\|^rule uses_revoked\|^rule retained_path\|^rule suspended_path' /tmp/trid06/rules; echo 'println([s.sources for s in solve retained_path(:trid, :deep5, [:trid], ?sources)])'; } > /tmp/trid06/case.triad ;;
              4) { cat /tmp/trid06/facts; grep '^rule in_path\|^rule active_node\|^fact fuel' /tmp/trid06/rules; echo 'println([s.to for s in solve active_node(:trid, ?to, [:trid], :h6)])'; } > /tmp/trid06/case.triad ;;
              5) cat /tmp/trid06/facts cognitive/native/s1_graph_06.triad > /tmp/trid06/case.triad ;;
            esac
            echo "CASE-$n"
            "$ROOT/bin/triad" --logic /tmp/trid06/case.triad > /tmp/trid06/result 2> /tmp/trid06/error
            echo "RC-$n=$?"
            head -c 300 /tmp/trid06/result; echo
            head -c 300 /tmp/trid06/error; echo
          done
      - name: Native S1 recursive graph, persistence, revocation and bounded pulses
        run: sh cognitive/native/tests/run_06.sh
      - name: TRID 0.5 S1 golden regression
        run: sh cognitive/native/tests/run_05.sh
