name: Triad Native Toolchain S2.0
on:
  push:
    paths:
      - 'selfhost/toolchain/**'
      - '.github/workflows/native-toolchain-s2.yml'
  pull_request:
    paths:
      - 'selfhost/toolchain/**'
      - '.github/workflows/native-toolchain-s2.yml'
permissions:
  contents: read
jobs:
  native-elf-emitter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Diagnose native Core emitter functions (nonblocking)
        run: |
          set +e
          for probe in 'emit_digit(10)' 'emit_byte(127)' 'emit_le(132, 8)' 'emit_zeros(2)' 'emit_elf_exit(42)'; do
            cp selfhost/toolchain/elf64_exit.triad /tmp/triad-native-emitter.triad
            printf '\n%s\n' "$probe" >> /tmp/triad-native-emitter.triad
            echo "NATIVE PROBE $probe"
            ./bin/triad /tmp/triad-native-emitter.triad > /tmp/triad-probe-out 2>&1
            echo "NATIVE RC=$?"
            head -c 160 /tmp/triad-probe-out
            echo
          done

      - name: Native Core parser prefix diagnostic (nonblocking)
        run: |
          set +e
          printf 'println("CORE-BASE")\n' > /tmp/basic.triad
          ./bin/triad /tmp/basic.triad; echo "base=$?"
          for boundary in 'function emit_byte' 'function emit_zeros' 'function emit_le' 'function mov_edi_imm32' 'function emit_elf_exit' 'unused_boundary'; do
            sed "/^$boundary/,$ d" selfhost/toolchain/elf64_exit.triad > /tmp/prefix.triad
            printf '\nprintln("CORE-PREFIX")\n' >> /tmp/prefix.triad
            echo "PREFIX: $boundary"
            ./bin/triad /tmp/prefix.triad; echo "prefix_rc=$?"
          done
      - name: Diagnose print, strsub and user function calls
        run: |
          set +e
          for expr in 'print("X")' 'print(strsub("abcd", 2, 2))' 'emit_digit(10)' 'emit_byte(127)'; do
            sed '/^function emit_byte/,$ d' selfhost/toolchain/elf64_exit.triad > /tmp/narrow.triad
            printf '\n%s\n' "$expr" >> /tmp/narrow.triad
            echo "NARROW=$expr"
            ./bin/triad /tmp/narrow.triad
            echo "NARROW-RC=$?"
          done
          cp selfhost/toolchain/elf64_exit.triad /tmp/full.triad
          printf 'print("L")\n' >> /tmp/full.triad
          ./bin/triad /tmp/full.triad; echo "FULL-RC=$?"
      - name: Native ELF code generation using Triad-Core
        run: sh selfhost/toolchain/tests/run.sh
      - name: Ensure zero JavaScript and current Triad conformance
        run: sh verify.sh
